name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StardewValleyDex v__VERSION__'
          releaseBody: |
            ## Download

            Escolha o instalador para o seu sistema:
            - **Windows**: baixe o `.exe` ou o `.msi`
            - **macOS**: baixe o `.dmg` (Intel e Apple Silicon)
            - **Linux**: baixe o `.AppImage`, o `.deb` ou o `.rpm`

            Após instalar, o app baixa os dados automaticamente na primeira execução (~165 MB).

            ### Primeira abertura
            Os instaladores não têm a assinatura paga da Microsoft e da Apple:
            - **Windows**: em "O Windows protegeu o computador", clique em **Mais informações** → **Executar assim mesmo**.
            - **macOS**: se o app não puder ser verificado, vá em **Ajustes do Sistema** → **Privacidade e Segurança** → **Abrir Mesmo Assim** (macOS 14 ou anterior: botão direito no app → **Abrir**).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
